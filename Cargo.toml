[workspace]
members = ["crates/carryctx-core", "crates/carryctx-sqlite", "crates/carryctx-vcs", "crates/carryctx-pack"]
resolver = "2"

[package]
name = "carryctx"
version = "0.8.2"
edition = "2024"
description = "Local-first project lifecycle control for coding agents and human collaborators."
authors = ["Xuepoo"]
license = "MIT"
repository = "https://github.com/Xuepoo/carryctx"
homepage = "https://carryctx.xuepoo.xyz"
keywords = ["coding-agent", "project-lifecycle", "project-state", "cli"]
categories = ["command-line-utilities", "development-tools"]

[features]
default = []

[dependencies]
carryctx-core = { path = "crates/carryctx-core" }
carryctx-sqlite = { path = "crates/carryctx-sqlite" }
carryctx-vcs = { path = "crates/carryctx-vcs" }
carryctx-pack = { path = "crates/carryctx-pack" }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
thiserror = "2"
anyhow = "1"
directories = "6"
globset = "0.4"
ulid = "3"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.11"
hex = "0.4"
tempfile = "3"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml_edit = "0.25.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serial_test = "4"
pretty_assertions = "1"

[lints.rust]
unsafe_code = "deny"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1

[package.metadata.docs.rs]
rustc-args = ["--cfg", "docsrs"]
