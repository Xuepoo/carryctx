[workspace]
members = ["crates/carryctx-core", "crates/carryctx-sqlite", "crates/carryctx-vcs", "crates/carryctx-pack", "crates/carryctx-cli"]
resolver = "2"

[package]
name = "carryctx"
version = "0.11.3"
edition = "2024"
description = "Local-first project lifecycle control for coding agents and human collaborators."
authors = ["Xuepoo"]
license = "MIT"
repository = "https://github.com/Xuepoo/carryctx"
homepage = "https://carryctx.xuepoo.xyz"
keywords = ["coding-agent", "project-lifecycle", "project-state", "cli"]
categories = ["command-line-utilities", "development-tools"]

[features]
default = []

[dependencies]
# Binary-only root (Step3): the thin `src/main.rs` wrapper needs only the CLI
# crate (entry surface) + clap (argument parsing). Everything else lives in
# `crates/carryctx-cli` (full deps there). Tracing init moved into `cli::run`.
carryctx-cli = { version = "0.11.3", path = "crates/carryctx-cli" }
clap = { version = "4", features = ["derive", "env"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serial_test = "4"
pretty_assertions = "1"
# Integration tests (`tests/`, root package) parse envelopes and open state DBs
# directly; these never link into the shipped binary.
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"
ulid = "3"
chrono = "0.4"

[lints.rust]
unsafe_code = "deny"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1

[package.metadata.docs.rs]
rustc-args = ["--cfg", "docsrs"]
