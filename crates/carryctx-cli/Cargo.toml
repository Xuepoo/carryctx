[package]
name = "carryctx-cli"
version = "0.11.2"
edition = "2024"
description = "CLI shell for carryctx — clap parsing, commands, rendering, adapter (config/filesystem/terminal), imperative application wiring — aggregates core/sqlite/vcs/pack"
license = "MIT"

[dependencies]
carryctx-core = { version = "0.11.2", path = "../carryctx-core" }
carryctx-sqlite = { version = "0.11.2", path = "../carryctx-sqlite" }
carryctx-vcs = { version = "0.11.2", path = "../carryctx-vcs" }
carryctx-pack = { version = "0.11.2", path = "../carryctx-pack" }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
thiserror = "2"
anyhow = "1"
directories = "6"
globset = "0.4"
ulid = "3"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.11"
hex = "0.4"
tempfile = "3"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml_edit = "0.25.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints.rust]
unsafe_code = "deny"
