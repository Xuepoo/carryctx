[package]
name = "carryctx-core"
version = "0.9.0"
edition = "2024"
description = "Pure domain + ports + application core for carryctx (no SQLite/Git/Clap/terminal/fs)"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ulid = "3"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
toml = "1.1"

[lints.rust]
unsafe_code = "deny"
