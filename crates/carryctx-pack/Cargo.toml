[package]
name = "carryctx-pack"
version = "0.9.0"
edition = "2024"
description = "ctxpack interchange for carryctx — manifest, format_version, JSONL, validation, migration, checksum, reader/writer (core-only, no SQLite/Git/CLI)"
license = "MIT"

[dependencies]
carryctx-core = { version = "0.9.0", path = "../carryctx-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.11"
hex = "0.4"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "deny"
