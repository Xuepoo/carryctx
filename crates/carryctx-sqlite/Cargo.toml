[package]
name = "carryctx-sqlite"
version = "0.9.0"
edition = "2024"
description = "SQLite persistence for carryctx — migrations, WAL, backup/restore, repository implementations"
license = "MIT"

[dependencies]
carryctx-core = { path = "../carryctx-core" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.11"
hex = "0.4"
ulid = "3"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "deny"
