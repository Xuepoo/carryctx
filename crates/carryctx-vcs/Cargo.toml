[package]
name = "carryctx-vcs"
version = "0.10.0"
edition = "2024"
description = "VCS abstraction for carryctx — VcsBackend trait, Git Tier1 and jj optional runtime backend, capabilities"
license = "MIT"

[dependencies]
carryctx-core = { version = "0.10.0", path = "../carryctx-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"

[lints.rust]
unsafe_code = "deny"
